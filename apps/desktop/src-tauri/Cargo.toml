[package]
name = "zeropass-desktop"
description = "ZeroPass desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
# The vault daemon admits the desktop application by this name, from the
# directory it is installed in (docs/spec/ipc.md §3.1).
name = "zeropass"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
# Always the production build: assets embedded from `../dist`, no development
# server, no devtools in release (docs/adr/0009-desktop-application.md).
# `dynamic-acl` is off: the page gets the capabilities in `capabilities/`
# and nothing at run time.
tauri = { version = "2.12.5", default-features = false, features = [
    "wry",
    "compression",
    "common-controls-v6",
    "custom-protocol",
    "x11",
    "dbus",
] }
zeroize = "1.9.1"
zp-client = { version = "0.0.0", path = "../../../crates/zp-client" }
zp-clipboard = { version = "0.0.0", path = "../../../crates/zp-clipboard" }
zp-ipc = { version = "0.0.0", path = "../../../crates/zp-ipc" }
