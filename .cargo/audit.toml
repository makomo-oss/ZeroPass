# cargo-audit configuration. Keep in step with [advisories] in deny.toml.

[advisories]
ignore = [
    # `basic-toml` is unmaintained. Build-time only, via the UniFFI bindings
    # generator (uniffi_bindgen -> askama); not part of anything that ships.
    "RUSTSEC-2026-0374",
    # `proc-macro-error` is unmaintained. Compile-time only (a procedural
    # macro), via the GTK 3 bindings that Tauri uses on Linux (ADR-0009).
    "RUSTSEC-2024-0370",
    # `glib` 0.18: an unsound iterator over GVariant strings (VariantStrIter).
    # Linux only, via the GTK 3 stack that Tauri uses; not used by ZeroPass.
    "RUSTSEC-2024-0429",
    # `chrono` is unmaintained. It is in Cargo.lock only as an optional
    # dependency of `serde_with` (through Tauri) that no build enables:
    # `cargo tree -i chrono --edges all --target all --all-features` finds
    # nothing. cargo-audit reads every entry of the lock file; cargo-deny
    # checks the dependency graph and does not report it, so deny.toml needs
    # no entry.
    "RUSTSEC-2026-0543",
    # `cookie` 0.18.2: private cookie nonces can repeat after fork. Private
    # cookies are behind the crate's `private` feature, which nothing enables;
    # Tauri uses only the cookie types (see deny.toml).
    "RUSTSEC-2026-0594",
]
