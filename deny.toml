# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Fail on any RustSec advisory (vulnerability, unmaintained, unsound) and yanked crates.
yanked = "deny"
ignore = [
    # `basic-toml` is unmaintained. It is only reached through UniFFI's bindings
    # generator (uniffi_bindgen -> askama), a build-time tool that reads this
    # project's own files; it is not part of any binary or library that ships.
    { id = "RUSTSEC-2026-0374", reason = "build-time only, via the UniFFI bindings generator" },
    # `proc-macro-error` is unmaintained. A procedural macro, run at compile
    # time only, reached through the GTK 3 bindings (glib-macros, gtk3-macros)
    # that Tauri uses on Linux; nothing of it is in a shipped program
    # (ADR-0009).
    { id = "RUSTSEC-2024-0370", reason = "compile-time only, via Tauri's GTK 3 bindings on Linux" },
    # `glib` 0.18 has an unsound string iterator over GVariant values
    # (VariantStrIter). Linux only, through the GTK 3 stack that Tauri uses;
    # ZeroPass does not handle GVariant values, and the fix exists only in
    # glib versions the GTK 3 bindings do not use (ADR-0009).
    { id = "RUSTSEC-2024-0429", reason = "Linux only, via Tauri's GTK 3 bindings; the affected iterator is not used" },
]

[licenses]
# Permissive licenses only. Add new entries deliberately, with a reason in the PR.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # UniFFI (the mobile bindings, ADR-0001). File-level copyleft: it applies to
    # changes to UniFFI itself, which this project does not make.
    "MPL-2.0",
]
confidence-threshold = 0.93

[licenses.private]
# Workspace crates are publish = false. They are GPL-3.0-only (see LICENSE); the
# list above is about what they may depend on, all of it GPLv3-compatible.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Crates the project must never depend on, anywhere in the graph.
deny = [
    # Prefer RustCrypto / dalek; OpenSSL drags in a large C attack surface.
    { crate = "openssl", reason = "use RustCrypto/dalek primitives instead" },
    { crate = "openssl-sys", reason = "use RustCrypto/dalek primitives instead" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
