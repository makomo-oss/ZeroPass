# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Fail on any RustSec advisory (vulnerability, unmaintained, unsound) and yanked crates.
yanked = "deny"
ignore = [
    # `basic-toml` is unmaintained. It is only reached through UniFFI's bindings
    # generator (uniffi_bindgen -> askama), a build-time tool that reads this
    # project's own files; it is not part of any binary or library that ships.
    { id = "RUSTSEC-2026-0374", reason = "build-time only, via the UniFFI bindings generator" },
]

[licenses]
# Permissive licenses only. Add new entries deliberately, with a reason in the PR.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # UniFFI (the mobile bindings, ADR-0001). File-level copyleft: it applies to
    # changes to UniFFI itself, which this project does not make.
    "MPL-2.0",
]
confidence-threshold = 0.93

[licenses.private]
# Workspace crates are publish = false.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Crates the project must never depend on, anywhere in the graph.
deny = [
    # Prefer RustCrypto / dalek; OpenSSL drags in a large C attack surface.
    { crate = "openssl", reason = "use RustCrypto/dalek primitives instead" },
    { crate = "openssl-sys", reason = "use RustCrypto/dalek primitives instead" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
