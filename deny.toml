# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Fail on any RustSec advisory (vulnerability, unmaintained, unsound) and yanked crates.
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only. Add new entries deliberately, with a reason in the PR.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.93

[licenses.private]
# Workspace crates are publish = false. They are GPL-3.0-only (see LICENSE); the
# list above is about what they may depend on, all of it GPLv3-compatible.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Crates the project must never depend on, anywhere in the graph.
deny = [
    # Prefer RustCrypto / dalek; OpenSSL drags in a large C attack surface.
    { crate = "openssl", reason = "use RustCrypto/dalek primitives instead" },
    { crate = "openssl-sys", reason = "use RustCrypto/dalek primitives instead" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
