[package]
name = "zp-sync"
description = "Transport-agnostic encrypted oplog synchronisation for ZeroPass."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
prost = { version = "0.14.5", default-features = false, features = ["derive", "std"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
zp-crypto = { version = "0.0.0", path = "../zp-crypto" }

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
