[package]
name = "zp-ipc"
description = "Local IPC protocol between ZeroPass processes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

# This crate does not inherit the workspace lints: it needs `unsafe_code = "deny"`
# instead of "forbid" so that the single `sys::windows` module can opt in to the
# unsafe code required to call the Win32 named-pipe API. Keep the rest in sync
# with the workspace table.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"

[dependencies]
prost = { version = "0.14.4", default-features = false, features = ["derive", "std"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }

# Peer credentials of a Unix domain socket and the user id. These are system-call
# wrappers, not a networking stack.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "net", "process"] }

[dev-dependencies]
tempfile = "3.27.0"
