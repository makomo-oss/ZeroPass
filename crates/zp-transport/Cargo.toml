[package]
name = "zp-transport"
description = "Local-only LAN and BLE transports for ZeroPass sync."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
if-addrs = "0.15.0"
mdns-sd = { version = "0.21.7", default-features = false }
sha2 = "0.11.1"
socket2 = "0.6.5"
thiserror = "2.0.21"
zeroize = "1.9.1"
zp-crypto = { version = "0.0.0", path = "../zp-crypto" }
zp-drive = { version = "0.0.0", path = "../zp-drive" }
zp-ipc = { version = "0.0.0", path = "../zp-ipc" }
zp-pairing = { version = "0.0.0", path = "../zp-pairing" }
zp-sync = { version = "0.0.0", path = "../zp-sync" }
zp-vault = { version = "0.0.0", path = "../zp-vault" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Foundation",
    "Foundation_Collections",
    "Security_Cryptography",
    "Storage_Streams",
] }

# The Bluetooth LE peripheral on Linux (`src/ble_linux.rs`): BlueZ over D-Bus,
# which is asynchronous; the peripheral runs its own Tokio runtime on a thread.
[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", default-features = false, features = ["bluetoothd"] }
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = ["net", "rt", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"
