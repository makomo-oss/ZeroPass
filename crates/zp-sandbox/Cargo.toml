[package]
name = "zp-sandbox"
description = "Starts ZeroPass processes without network access (Windows AppContainer)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

# This crate does not inherit the workspace lints: it needs `unsafe_code = "deny"`
# instead of "forbid" so that the two `windows*` modules can opt in to the unsafe
# code required to call the Win32 process and security APIs. Keep the rest in sync
# with the workspace table.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

# Resource limits and the "dumpable" flag: system-call wrappers.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }

[dev-dependencies]
tempfile = "3.27.0"
zp-ipc = { version = "0.0.0", path = "../zp-ipc" }
