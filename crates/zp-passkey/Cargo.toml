[package]
name = "zp-passkey"
description = "OS-independent WebAuthn passkey authenticator engine for ZeroPass."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc", "pkcs8", "zeroize"] }
getrandom = "0.4.3"
p256 = { version = "0.14.0", default-features = false, features = ["alloc", "ecdsa", "pkcs8"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
zeroize = "1.9.1"
zp-crypto = { version = "0.0.0", path = "../zp-crypto" }
zp-origin = { version = "0.0.0", path = "../zp-origin" }
zp-vault = { version = "0.0.0", path = "../zp-vault" }

[dev-dependencies]
tempfile = "3.27.0"
