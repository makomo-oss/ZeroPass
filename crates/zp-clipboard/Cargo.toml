[package]
name = "zp-clipboard"
description = "Copies secrets to the clipboard so that they do not stay there."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

# This crate does not inherit the workspace lints: it needs `unsafe_code = "deny"`
# instead of "forbid" so that the single `windows` module can opt in to the unsafe
# code required to call the Win32 clipboard API. Keep the rest in sync with the
# workspace table.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"

[dependencies]
zeroize = "1.9.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }
