[package]
name = "zp-pairing"
description = "Device identity, QR pairing and Noise secure channels for ZeroPass."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "std", "use-chacha20poly1305", "use-curve25519", "use-getrandom", "use-sha2"] }
thiserror = "2.0.21"
zeroize = "1.9.1"
zp-crypto = { version = "0.0.0", path = "../zp-crypto" }
zp-sync = { version = "0.0.0", path = "../zp-sync" }

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
