[package]
name = "zp-crypto"
description = "Cryptographic primitives, secret types and key hierarchy for ZeroPass."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

# This crate does not inherit the workspace lints: it needs `unsafe_code = "deny"`
# instead of "forbid" so that the single `mem` module can opt in to the unsafe code
# required for page-locked key storage. Keep the rest in sync with the workspace table.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
region = "4.0.1"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
zeroize = { version = "1.9.1", features = ["alloc"] }
