[package]
name = "zp-vault"
description = "Encrypted vault storage, item model and TOTP engine for ZeroPass."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
prost = { version = "0.14.4", default-features = false, features = ["derive", "std"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["derive"] }
zp-crypto = { version = "0.0.0", path = "../zp-crypto" }

[dev-dependencies]
tempfile = "3.27.0"
