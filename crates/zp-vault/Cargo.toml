[package]
name = "zp-vault"
description = "Encrypted vault storage, item model and TOTP engine for ZeroPass."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
hmac = "0.13.0"
prost = { version = "0.14.4", default-features = false, features = ["derive", "std"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["derive"] }
zp-crypto = { version = "0.0.0", path = "../zp-crypto" }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"

[[bench]]
name = "vault"
harness = false
