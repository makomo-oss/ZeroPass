# cargo-nextest (CI runs the tests with it: every test in a process of its
# own, the test binaries side by side instead of one after the other).
#
# Tests that touch something the whole machine shares must not overlap.
# With `cargo test` they never did, being in different binaries.

[test-groups]
# The system clipboard: replaced and read back.
clipboard = { max-threads = 1 }
# The AppContainer of the sandbox probe, shared by the tests of one binary.
sandbox-probe = { max-threads = 1 }

[[profile.default.overrides]]
filter = "(package(zp-clipboard) & binary(clipboard)) | (package(zp-cli) & binary(e2e) & test(init_add_get_list_totp_and_lock))"
test-group = "clipboard"

[[profile.default.overrides]]
filter = "package(zp-sandbox) & binary(sandbox)"
test-group = "sandbox-probe"

[profile.ci]
# Report every failing test, not only the first.
fail-fast = false
# Name tests that run long; never stop or retry them.
slow-timeout = { period = "60s" }
