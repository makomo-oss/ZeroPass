[package]
name = "zp-nmh"
description = "ZeroPass native messaging host bridging the browser extension to the vault daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zeroize = "1.9.1"
zp-client = { version = "0.0.0", path = "../../crates/zp-client" }
zp-ipc = { version = "0.0.0", path = "../../crates/zp-ipc" }

[dev-dependencies]
tempfile = "3.27.0"
zp-passkey = { version = "0.0.0", path = "../../crates/zp-passkey" }
