[package]
name = "zp-syncd"
description = "ZeroPass proximity sync daemon (layer 4): LAN/BLE only, never holds vault keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
zp-crypto = { version = "0.0.0", path = "../../crates/zp-crypto" }
zp-ipc = { version = "0.0.0", path = "../../crates/zp-ipc" }
zp-sandbox = { version = "0.0.0", path = "../../crates/zp-sandbox" }
zp-transport = { version = "0.0.0", path = "../../crates/zp-transport" }

[dev-dependencies]
tempfile = "3.27.0"
