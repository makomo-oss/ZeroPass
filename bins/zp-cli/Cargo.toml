[package]
name = "zp-cli"
description = "ZeroPass command-line client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
qrcode = { version = "0.14.1", default-features = false }
rpassword = "7.5.5"
zeroize = "1.9.1"
zp-crypto = { version = "0.0.0", path = "../../crates/zp-crypto" }
zp-hwkey = { version = "0.0.0", path = "../../crates/zp-hwkey" }
zp-pairing = { version = "0.0.0", path = "../../crates/zp-pairing" }
zp-sync = { version = "0.0.0", path = "../../crates/zp-sync" }
zp-transport = { version = "0.0.0", path = "../../crates/zp-transport" }
zp-vault = { version = "0.0.0", path = "../../crates/zp-vault" }

[dev-dependencies]
tempfile = "3.27.0"
