[package]
name = "zp-cli"
description = "ZeroPass command-line client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
rpassword = "7.5.5"
zeroize = "1.9.1"
zp-crypto = { version = "0.0.0", path = "../../crates/zp-crypto" }
zp-hwkey = { version = "0.0.0", path = "../../crates/zp-hwkey" }
zp-vault = { version = "0.0.0", path = "../../crates/zp-vault" }

[dev-dependencies]
tempfile = "3.27.0"
