name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run so newly published RustSec advisories surface even without commits.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  # Lets the tests that replace the content of the clipboard run (Windows).
  ZEROPASS_TEST_CLIPBOARD: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The toolchain (and its components) is installed from rust-toolchain.toml.
      - run: cargo fmt --all --check

  test:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # The desktop application (Tauri) links against WebKitGTK on Linux.
      - name: Install the WebKitGTK development files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  desktop-ui:
    name: desktop UI (typecheck, test, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # Fails on moderate or worse. Known low-severity findings in build-time
      # tools are listed in apps/desktop/README.md.
      - run: npm audit --audit-level=moderate

  extension:
    name: browser extension (typecheck, test, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:firefox
      - run: npm audit --audit-level=moderate

  android:
    name: android app (core, bindings, build)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: Swatinem/rust-cache@v2
      - name: Install the Rust targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked --version 4.1.2
      # The runner's Android SDK and NDK (apps/android/README.md).
      - name: Build the Rust core for Android and its Kotlin bindings
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" bash apps/android/build-core.sh
      - name: Build the app
        working-directory: apps/android
        run: ./gradlew --no-daemon assembleDebug

  extension-e2e:
    name: browser extension end to end (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Build the extension and the test browser
        working-directory: apps/extension
        run: |
          npm ci
          npx playwright install chromium
          npm run build
      - name: Build the bridge and the daemon
        run: cargo build --locked -p zp-nmh -p zp-vaultd -p zp-cli -p zp-keyagent
      # The real extension in Chromium, the real bridge (registered for the
      # test browser), the real vault daemon in its sandbox; pages served
      # locally. The sites and webauthn.io tests need the internet and are
      # run by hand.
      - name: Fill pages through the extension
        working-directory: apps/extension
        run: node e2e/local.e2e.mjs
      # Passkeys made and used through the extension, checked by an
      # independent relying-party library.
      - name: Passkeys through the extension
        working-directory: apps/extension
        run: node e2e/passkeys.e2e.mjs

  desktop-e2e:
    name: desktop application end to end (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Build the page
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: Build the programs
        run: cargo build --locked -p zeropass-desktop -p zp-vaultd -p zp-keyagent -p zp-syncd -p zp-cli
      # Drives the real application (and the real vault daemon, in its
      # sandbox) through the webview's debugging protocol.
      - name: Drive the application
        working-directory: apps/desktop
        run: node e2e/app.e2e.mjs

  install-windows:
    name: package + install on a clean machine (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # The package script builds the desktop application's user interface.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Build the package (unsigned)
        shell: pwsh
        run: ./scripts/package-windows.ps1
      # The runner is a fresh machine: install, start at "logon", use and
      # remove ZeroPass (P3-07). The runner is an administrator, as the
      # installer needs; what a standard user meets under Program Files is
      # covered by bins/zp-cli/tests/installed.rs.
      - name: Install, use and uninstall
        shell: pwsh
        run: ./scripts/smoke-install-windows.ps1 -Package (Get-ChildItem target/package -Directory | Select-Object -First 1).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: zeropass-windows-unsigned
          path: target/package/*.zip*
          retention-days: 7

  supply-chain:
    name: cargo-deny + cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings
      - name: Offline crates have no networking dependencies
        run: bash scripts/check-offline-deps.sh
